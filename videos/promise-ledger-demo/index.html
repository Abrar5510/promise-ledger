      * {

        height: 1080px;
        overflow: hidden;
        background: #FAFAFA;

      .scene {

        inset: 0;

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-01-title-card", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 17.5);
        tl.fromTo("#el-02-reveal", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 17.5);
        tl.to("#el-07-orphan", { scale: 2.5, opacity: 0, filter: "blur(8px)", duration: 0.4, ease: "power3.in" }, 78.5);
        tl.fromTo("#el-08-paste", { scale: 0.5, opacity: 0, filter: "blur(8px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, 78.5);
        tl.to("#el-11-mechanism", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 118);
        tl.fromTo("#el-12-signoff", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 118);
        tl.to({}, { duration: 125 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
