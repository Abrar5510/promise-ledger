      :root {

<style>
  #captions-root {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .caption-layer {
    position: absolute;
    inset: 0;
    z-index: 20;
    pointer-events: none;
  }
  /* the keep-out band, from captionBand(H) — frame content stays above it */
  .caption-stage {
    position: absolute;
    left: 0;
    right: 0;
    top: var(--cap-band-top, 900px);
    height: var(--cap-band-height, 180px);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .caption-group {
    /* every group is absolutely stacked over the SAME band — exactly one shown at a
       time via opacity. Must be absolute: in-flow groups would lay out side-by-side. */
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
  }

  /* THE stone card — single 1px taupe hairline border (cartesian's universal
     structural device), SHARP corners, ZERO shadow, ZERO fill beyond the stone canvas */
  .caption-pill {
    max-width: 78%;
    padding: 20px 44px 24px;
    background: var(--cap-canvas, #ede8e0);
    border: 1px solid var(--cap-accent-2, #b8b0a4);
    border-radius: 0;
  }
  .caption-line {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0.1em 0.34em;
    font-family: "Geist", Georgia, serif;
    font-weight: 400;
    font-size: clamp(40px, 4.4vw, 58px);
    line-height: 1.16;
    letter-spacing: -0.01em;
  }

  /* upcoming — faint ink, no mark */
  .caption-word {
    display: inline-block;
    padding: 0 0.06em;
    border-bottom: 1px solid transparent;
    color: color-mix(in srgb, var(--cap-ink, #1a1a1a) 42%, var(--cap-canvas, #ede8e0));
  }
  /* current word — a QUIET marker: a faint warm-stone wash behind solid ink, plus a
     1px taupe hairline underline (restraint, not a loud block; SHARP, NO shadow) */
  .caption-word.is-active {
    color: var(--cap-ink, #1a1a1a);
    background: color-mix(in srgb, var(--cap-accent, #8a8178) 18%, var(--cap-canvas, #ede8e0));
    border-bottom: 1px solid var(--cap-accent, #8a8178);
  }
  /* already spoken — solid ink, wash + underline cleared */
  .caption-word.is-spoken {
    color: var(--cap-ink, #1a1a1a);
    background: transparent;
    border-bottom: 1px solid transparent;
  }

  /* optional per-word accents (dormant until a word-classer tags them) */
  /* brand / key term — Playfair Display italic, cartesian's only display inflection */
  .caption-word.cap-brand {
    font-style: italic;
  }
  /* numerals / data — the body sans voice, slightly recessed */
  .caption-word.cap-num {
    font-family: "Geist", ui-sans-serif, sans-serif;
    color: color-mix(in srgb, var(--cap-ink, #1a1a1a) 72%, var(--cap-canvas, #ede8e0));
  }
  /* emphasis — a 1px taupe hairline underline (no second color; stone-and-ink only) */
  .caption-word.cap-cta {
    text-decoration: underline;
    text-decoration-thickness: 1px;
    text-decoration-color: var(--cap-accent, #8a8178);
    text-underline-offset: 0.12em;
  }

  @media (max-aspect-ratio: 9/16) {
    .caption-pill {
      max-width: 92%;
    }
    .caption-line {
      font-size: clamp(34px, 5.4vw, 48px);

  }
